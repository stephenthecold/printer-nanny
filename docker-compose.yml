# On-prem central stack: Postgres + API + worker + dashboard behind Caddy.
#
# DON'T EDIT THIS FILE to customise a deployment — `deploy/install.sh --update`
# fast-forwards it, so local edits collide with every upstream change. Two
# supported knobs instead, both survive updates untouched:
#   1. `.env`                        — see .env.example for every variable below.
#   2. `docker-compose.override.yml` — arbitrary overrides; Compose merges it
#                                      automatically and it is gitignored.
#                                      Start from docker-compose.override.yml.example.
# Already edited this file? `bash deploy/install.sh --migrate-compose` backs the
# edits up and hands them back as an override to fill in.
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      # Changing these on an EXISTING install does NOT change the password in
      # the pgdata volume -- Postgres only reads them when it initialises an
      # empty data directory, so a changed password locks api/worker out until
      # you ALTER USER inside the running db. See .env.example.
      POSTGRES_USER: ${POSTGRES_USER:-nanny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nanny}
      POSTGRES_DB: ${POSTGRES_DB:-printer_nanny}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Interpolated by Compose (not the container's shell) so the probe follows
      # POSTGRES_USER/POSTGRES_DB instead of silently checking a role that no
      # longer exists. Same defaults as above -- keep the three in step.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nanny} -d ${POSTGRES_DB:-printer_nanny}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Self-heal on host reboot. Without this a transient crash on startup
    # (DNS race, port conflict, etc.) leaves the container dead until manual
    # `docker compose up -d`.
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      # Keep the credentials here in lockstep with the db service above; the
      # password must be URL-safe (no @ : / ? # in it) since it rides in a URL.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nanny}:${POSTGRES_PASSWORD:-nanny}@db:5432/${POSTGRES_DB:-printer_nanny}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
      FREESCOUT_BASE_URL: ${FREESCOUT_BASE_URL:-}
      FREESCOUT_API_KEY: ${FREESCOUT_API_KEY:-}
      # Seeds the Settings row on first boot only. The `mailhog` default
      # resolves only when the optional mailhog profile is up (see below).
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      # Cache for the NSSM mirror (and other agent install artifacts). Persisted
      # so the upstream download only happens once per central server.
      PN_CACHE_DIR: /var/lib/printer-nanny/cache
      # Uploaded vendor driver packages. On a volume rather than in the
      # database so `pg_dump` backups stay small and fast -- the trade,
      # surfaced in the UI, is that a DB restore does not bring them back.
      PN_DRIVER_DIR: ${PN_DRIVER_DIR:-/var/lib/printer-nanny/drivers}
    # Exposed on the host so an external reverse proxy (your own Caddy / Nginx /
    # Traefik) can point at it. The bundled `caddy` service below is opt-in.
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - installer_cache:/var/lib/printer-nanny/cache
      - driver_packages:/var/lib/printer-nanny/drivers
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations, bootstrap admin user on first run (idempotent), then serve.
    command: >
      sh -c "alembic upgrade head &&
             python -m central.seed --init &&
             uvicorn central.main:app --host 0.0.0.0 --port 8000"
    # Readiness, not just liveness: /readyz fails when the database is
    # unreachable (/healthz answers 200 regardless -- it is a pure process
    # check). `worker=skip` narrows it to the DB check on purpose: a stalled
    # worker is the WORKER container's fault, and marking api unhealthy for it
    # would send an operator debugging the wrong process. The full check
    # (GET /readyz, no params) is what uptime monitoring should poll.
    # start_period covers `alembic upgrade head` + seed on first boot.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:8000/readyz?worker=skip' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # Self-heal on host reboot. A transient docker-DNS race on boot (api
    # coming up before db's hostname is resolvable on the bridge network)
    # would otherwise leave the api dead and the site stuck on 502 until
    # someone runs `docker compose up -d` by hand.
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nanny}:${POSTGRES_PASSWORD:-nanny}@db:5432/${POSTGRES_DB:-printer_nanny}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
      FREESCOUT_BASE_URL: ${FREESCOUT_BASE_URL:-}
      FREESCOUT_API_KEY: ${FREESCOUT_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
    depends_on:
      db:
        condition: service_healthy
    # WORKER_INTERVAL is the cycle length in seconds. Safe to raise: the
    # healthcheck derives its staleness threshold from the interval the worker
    # actually recorded (central.health.stale_after_seconds), so a slow cycle
    # widens its own tolerance instead of paging you.
    command: ["python", "-m", "central.worker.run", "--interval", "${WORKER_INTERVAL:-60}"]
    # The worker has no HTTP surface, so this is a command-based check that
    # inspects the per-job `worker_job_runs` stamps the cycle writes -- the same
    # data /readyz reads (central.health), so the two can't disagree. It reads
    # the stamps from the DB rather than "did I personally stamp", so a second
    # worker container that loses the leader-lock race stays healthy while the
    # leader does the work. Fails on stale, never-stamped, or DB-unreachable.
    # start_period allows waiting on db + the first cycle (interval above).
    # Note: under plain compose an unhealthy container is a SIGNAL (visible in
    # `docker compose ps`), not a restart -- nothing here depends on it.
    healthcheck:
      test: ["CMD", "python", "-m", "central.worker.health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped

  # Local SMTP catcher so email alerts are visible in dev (http://localhost:8025).
  # OPT-IN (`docker compose --profile mailhog up -d`, or MAILHOG_PROFILE=1 in
  # .env for the installer). It is a development tool that accepts unauthenticated
  # mail and serves an unauthenticated web UI of everything it caught, so it has
  # no business publishing a host port on a production install -- which is what
  # it did before it was put behind this profile. Enable it and the
  # SMTP_HOST/SMTP_PORT defaults above resolve; leave it off and set real SMTP
  # under Settings.
  mailhog:
    image: ${MAILHOG_IMAGE:-mailhog/mailhog}
    profiles: ["mailhog"]
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"

  # Optional bundled reverse proxy. Opt-in (`docker compose --profile caddy up -d`).
  # Skip this if you already run Caddy / Nginx / Traefik on the host — just point
  # your existing proxy at http://<docker-host>:${API_PORT:-8000}. The bundled
  # Caddyfile is generated by `deploy/install.sh`: pick `bundled` and supply a
  # hostname + ACME email to get automatic Let's Encrypt certs on :80 + :443.
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    profiles: ["caddy"]
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # certificate + ACME account state (persist across restarts)
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  # Optional built-in site agent (opt-in: `docker compose --profile agent up -d`).
  # LINUX ONLY for real SNMP — network_mode: host lets it reach LAN printers. On
  # Docker Desktop (macOS/Windows) containers run in a VM and can't see your LAN;
  # there, run the agent on the host instead (scripts/install-local-agent-macos.sh
  # or deploy/printer-nanny-agent.service). Enroll first to get the id/key:
  #   docker compose exec api python -m central.enroll --subnet <cidr> --json
  #   PN_AGENT_ID=.. PN_API_KEY=.. docker compose --profile agent up -d agent
  agent:
    build:
      context: .
      dockerfile: deploy/agent.Dockerfile
    profiles: ["agent"]
    network_mode: host
    environment:
      # Empty defaults so the normal `docker compose up` (without --profile agent)
      # never errors; the agent fails loudly at runtime if these aren't set.
      PN_CENTRAL_URL: ${PN_CENTRAL_URL:-http://localhost:8080}
      PN_AGENT_ID: ${PN_AGENT_ID:-}
      PN_API_KEY: ${PN_API_KEY:-}
    restart: always

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  installer_cache:
  driver_packages:
