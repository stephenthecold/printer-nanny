name: CI

on:
  push:
    branches: [main]
  pull_request:


# Least privilege: unset, this inherits the repo/org default, which on a repo
# that has never been tightened is read/write across contents, packages,
# issues and PRs. postgres.yml and windows-client.yml already set this.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 proves the runtime-compat floor; 3.12 is the Docker runtime.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agent]"
      - name: Lint (ruff)
        run: ruff check central agent tests scripts migrations
      - name: Test (pytest)
        run: pytest -q
      - name: Migrations apply + reverse (SQLite)
        run: |
          DATABASE_URL="sqlite:///./_ci.sqlite3" alembic upgrade head
          DATABASE_URL="sqlite:///./_ci.sqlite3" alembic downgrade base

  agent-standalone:
    # The agent package must install on its own, with no central dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install ./agent
          printer-nanny-agent --version
          printer-nanny-workstation --help > /dev/null
          python -c "import printer_nanny_agent.poller, printer_nanny_agent.runner"
          # Every subpackage, imported by name. setuptools' packages.find picks
          # new ones up automatically, but a mistake there fails at INSTALL time
          # on a customer's machine and nowhere else -- the providers/ layer
          # already shipped broken once for exactly this reason. Importing each
          # platform module explicitly also proves none of them needs its own OS
          # to import, which is what lets the client fail with a sentence on a
          # box that is neither Windows nor macOS.
          python -c "
          import printer_nanny_agent.providers
          import printer_nanny_agent.platforms as p
          from printer_nanny_agent.platforms import macos, unsupported, windows
          import printer_nanny_agent.workstation, printer_nanny_agent.workstation_service
          for backend in (macos, windows, unsupported):
              for attr in ('NAME', 'SUPPORTS_VENDOR_DRIVERS', 'queue_name',
                           'default_state_dir', 'console_user',
                           'provision_queues', 'set_default_printer'):
                  assert hasattr(backend, attr), (backend.NAME, attr)
          assert p.current() is unsupported, p.current().NAME
          print('agent package imports cleanly:', p.current().NAME)
          "
